<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover : l'appli occupe tout l'écran, on gère nous-mêmes l'encoche et le bas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060912">
  <meta name="description" content="Coach Street : ton coach de street workout, séances guidées, XP, badges et suivi du poids">
  <title>Coach Street</title>

  <!-- Pour l'installation sur l'écran d'accueil -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coach Street">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Les dégradés utilisés par les bonshommes et les anneaux -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="cs-g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="160">
        <stop offset="0" stop-color="#39ff88"/><stop offset="1" stop-color="#2f7bff"/>
      </linearGradient>
      <linearGradient id="cs-ring" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#39ff88"/><stop offset="1" stop-color="#00c2ff"/>
      </linearGradient>
      <linearGradient id="cs-blue" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#2f5bff"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Le contenu de l'écran est dessiné ici par app.js -->
  <main id="app"></main>

  <!-- Barre d'onglets en bas -->
  <nav id="nav">
    <button data-vue="seance"><span>🏋️</span>Séance</button>
    <button data-vue="poids"><span>⚖️</span>Poids</button>
    <button data-vue="stats"><span>📊</span>Stats</button>
    <button data-vue="badges"><span>🏅</span>Badges</button>
    <button data-vue="bilan"><span>📋</span>Bilan</button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <canvas id="confettis"></canvas>

  <!-- Le code (l'ordre compte : les règles d'abord, puis les dessins, puis les écrans) -->
  <script src="coach.js"></script>
  <script src="figures.js"></script>
  <script src="app.js"></script>
</body>
</html>
