<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Mes séances de street workout et ma progression">
  <title>Street Workout</title>

  <!-- Pour l'installation sur l'écran d'accueil -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone-192.png">
  <!-- Spécial iPhone : icône, nom et barre du haut quand l'appli est installée -->
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- En-tête : titre + compteur de séances de la semaine -->
  <header class="entete">
    <h1>Street Workout</h1>
    <div id="compteur-semaine" class="compteur"></div>
  </header>

  <!-- Le contenu de l'onglet choisi est dessiné ici par app.js -->
  <main id="vue"></main>

  <!-- Barre d'onglets en bas de l'écran -->
  <nav class="onglets">
    <button data-action="onglet" data-vue="seance"><span>🏋️</span>Séance</button>
    <button data-action="onglet" data-vue="progres"><span>📈</span>Progrès</button>
    <button data-action="onglet" data-vue="poids"><span>⚖️</span>Poids</button>
    <button data-action="onglet" data-vue="reglages"><span>⚙️</span>Réglages</button>
  </nav>

  <!-- Minuteur plein écran (caché tant qu'il ne tourne pas) -->
  <div id="minuteur" class="minuteur cache">
    <div id="minuteur-titre" class="minuteur-titre">Repos</div>
    <div id="minuteur-temps" class="minuteur-temps">1:30</div>
    <div id="minuteur-sous" class="minuteur-sous"></div>
    <div class="minuteur-boutons">
      <button class="btn secondaire" data-action="minuteur-moins">−15 s</button>
      <button class="btn secondaire" data-action="minuteur-plus">+15 s</button>
    </div>
    <button class="btn principal" data-action="minuteur-passer">Passer ⏭</button>
  </div>

  <!-- Petit message temporaire -->
  <div id="toast" class="toast cache"></div>

  <!-- Le code de l'appli (l'ordre compte !) -->
  <script src="exercices.js"></script>
  <script src="progression.js"></script>
  <script src="app.js"></script>
</body>
</html>
