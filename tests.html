<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests de l'appli</title>
  <style>
    body { background: #0f1115; color: #f1f3f6; font-family: system-ui, sans-serif; padding: 16px; font-size: 15px; }
    .ok { color: #34c759; } .ko { color: #ff5a4f; font-weight: bold; }
    pre { white-space: pre-wrap; color: #9aa3b2; }
  </style>
</head>
<body>
  <h1>Tests de l'appli</h1>
  <div id="resultats"></div>

  <script src="exercices.js"></script>
  <script src="animations.js"></script>
  <script src="progression.js"></script>
  <script src="programme.js"></script>
  <script>
    // Petit outil de test : affiche ✅ ou ❌ pour chaque vérification
    let reussis = 0, rates = 0;
    function verifier(nom, condition) {
      const p = document.createElement("div");
      p.className = condition ? "ok" : "ko";
      p.textContent = (condition ? "✅ " : "❌ ") + nom;
      document.getElementById("resultats").appendChild(p);
      condition ? reussis++ : rates++;
    }

    const pompes = FAMILLES.find(f => f.id === "pompes");
    const gainage = FAMILLES.find(f => f.id === "gainage");
    const tractions = FAMILLES.find(f => f.id === "tractions");

    // 1. Séance réussie → +1 répétition
    let r = appliquerResultat(pompes, { niveau: 0, objectif: 6, echecs: 0 }, [6, 6, 7]);
    verifier("Réussite : 3×6 → 3×7", r.type === "progres" && r.etat.objectif === 7);

    // 2. Une série ratée → l'objectif ne bouge pas
    r = appliquerResultat(pompes, { niveau: 0, objectif: 8, echecs: 0 }, [8, 8, 6]);
    verifier("Échec : l'objectif reste à 8", r.type === "stagne" && r.etat.objectif === 8 && r.etat.echecs === 1);

    // 3. Séries pas toutes cochées → échec
    r = appliquerResultat(pompes, { niveau: 0, objectif: 8, echecs: 0 }, [10, 10]);
    verifier("2 séries sur 3 seulement = échec", r.type === "stagne");

    // 4. 3 échecs de suite → l'objectif baisse d'un cran
    r = appliquerResultat(pompes, { niveau: 0, objectif: 10, echecs: 2 }, [5, 5, 5]);
    verifier("3e échec : objectif 10 → 9, compteur remis à 0", r.type === "baisse" && r.etat.objectif === 9 && r.etat.echecs === 0);

    // 5. Au premier niveau, l'objectif peut baisser jusqu'à la moitié du début (jamais bloqué)
    r = appliquerResultat(pompes, { niveau: 0, objectif: 6, echecs: 2 }, [2, 2, 2]);
    verifier("1er niveau : 6 → 5 après 3 échecs", r.etat.objectif === 5);
    r = appliquerResultat(pompes, { niveau: 0, objectif: 3, echecs: 2 }, [1, 1, 1]);
    verifier("1er niveau : ne descend pas sous la moitié du début (3)", r.etat.objectif === 3);

    // 6. Une réussite remet le compteur d'échecs à 0
    r = appliquerResultat(pompes, { niveau: 0, objectif: 8, echecs: 2 }, [8, 8, 8]);
    verifier("Réussite après 2 échecs : compteur à 0", r.etat.echecs === 0 && r.etat.objectif === 9);

    // 7. Objectif max réussi → niveau suivant
    r = appliquerResultat(pompes, { niveau: 0, objectif: 15, echecs: 0 }, [15, 15, 15]);
    verifier("3×15 réussi → niveau 2 (pompes genoux, 3×6)", r.type === "niveau" && r.etat.niveau === 1 && r.etat.objectif === 6);

    // 8. Ne dépasse pas le max
    r = appliquerResultat(gainage, { niveau: 0, objectif: 58, echecs: 0 }, [60, 60, 60]);
    verifier("Gainage : 58 s +5 plafonné à 60 s", r.etat.objectif === 60);

    // 9. Dernier niveau maîtrisé → on reste
    const dernier = tractions.niveaux.length - 1;
    r = appliquerResultat(tractions, { niveau: dernier, objectif: 10, echecs: 0 }, [10, 10, 10]);
    verifier("Dernier niveau maîtrisé : on reste au dernier niveau", r.type === "max" && r.etat.niveau === dernier);

    // 10. Compteur de la semaine (lundi → dimanche)
    const mercredi = new Date(2026, 10, 25, 8, 0);   // mercredi 25 nov. 2026
    const seances = [
      { date: new Date(2026, 10, 22, 8, 0).toISOString() },  // dimanche d'avant
      { date: new Date(2026, 10, 23, 7, 0).toISOString() },  // lundi
      { date: new Date(2026, 10, 25, 7, 0).toISOString() },  // mercredi
    ];
    verifier("Compteur semaine : 2 séances depuis lundi", seancesCetteSemaine(seances, mercredi) === 2);

    // 11. Chaque niveau a son animation et ses conseils
    let manque = [];
    FAMILLES.forEach(function (f) {
      f.niveaux.forEach(function (n, i) {
        if (!ANIM.existe(f.id + "-" + i)) manque.push("animation " + f.id + "-" + i);
        if (!n.points || n.points.length < 2) manque.push("points " + n.nom);
        if (!n.erreurs || n.erreurs.length < 1) manque.push("erreurs " + n.nom);
      });
    });
    ECHAUFFEMENT.forEach(function (e) { if (!ANIM.existe(e.anim)) manque.push("échauffement " + e.anim); });
    verifier("Animations et conseils présents partout" + (manque.length ? " — manque : " + manque.join(", ") : ""), manque.length === 0);

    // 12. Les dessins ne contiennent pas de valeurs cassées (NaN)
    const casses = ANIM.cles().filter(function (c) {
      for (let t = 0; t < ANIM.duree(c); t += 150) if (ANIM.instant(c, t).indexOf("NaN") >= 0) return true;
      return false;
    });
    verifier("Aucune animation cassée" + (casses.length ? " : " + casses.join(", ") : ""), casses.length === 0);

    // 13. Échauffement d'environ 5 minutes
    const totalEchauffement = ECHAUFFEMENT.reduce(function (t, e) { return t + e.duree; }, 0);
    verifier("Échauffement entre 4 et 6 minutes (" + totalEchauffement + " s)", totalEchauffement >= 240 && totalEchauffement <= 360);

    // 14. Records
    const histo = [
      { exercices: [{ famille: "pompes", niveau: 2, faites: [8, 10, 9] }] },
      { exercices: [{ famille: "pompes", niveau: 2, faites: [11, 9, 9] }, { famille: "pompes", niveau: 3, faites: [] }] },
    ];
    verifier("Record pompes niveau 3 : 11", meilleureSerie(histo, "pompes", 2) === 11);
    verifier("Pas de record à un niveau jamais fait", meilleureSerie(histo, "pompes", 4) === null);
    verifier("Plus haut niveau avec des séries faites : 2 (pas 3, vide)", niveauMaxAtteint(histo, "pompes") === 2);

    // 15. Tendance du poids
    const jour = function (n) { return new Date(2026, 10, 1 + n, 8).toISOString(); };
    let tp = tendancePoids([{ date: jour(0), kg: 60 }], 70, new Date(2026, 10, 2));
    verifier("1 seule pesée : on attend", tp.type === "attente");
    tp = tendancePoids([{ date: jour(0), kg: 60 }, { date: jour(7), kg: 60.3 }, { date: jour(14), kg: 60.7 }], 70);
    verifier("+0,35 kg/semaine : bon rythme (" + tp.parSemaine + ")", tp.type === "bon" && Math.abs(tp.parSemaine - 0.35) < 0.05);
    tp = tendancePoids([{ date: jour(0), kg: 61 }, { date: jour(7), kg: 61 }, { date: jour(14), kg: 61.1 }], 70);
    verifier("Poids qui ne bouge pas : stagne", tp.type === "stagne");
    tp = tendancePoids([{ date: jour(0), kg: 60 }, { date: jour(14), kg: 62 }], 70);
    verifier("+1 kg/semaine : trop rapide", tp.type === "rapide");
    tp = tendancePoids([{ date: jour(0), kg: 62 }, { date: jour(14), kg: 61.5 }], 70);
    verifier("Poids qui baisse : baisse", tp.type === "baisse");
    tp = tendancePoids([{ date: jour(0), kg: 69.5 }, { date: jour(14), kg: 70.1 }], 70);
    verifier("Objectif dépassé : atteint", tp.type === "atteint");


    // ===== NOUVEAUTÉS : programme personnalisé =====
    const profilDe = function (extra) {
      return Object.assign({ classique: false, prenom: "", objectif: "muscle", niveau: "intermediaire", materiel: [], seancesParSemaine: 3, duree: 30, poidsVise: null, limitations: [] }, extra);
    };

    // 17. Déjà au plus bas d'un niveau + échecs → on repasse au niveau plus facile
    r = appliquerResultat(pompes, { niveau: 2, objectif: 5, echecs: 2 }, [3, 3, 3]);
    verifier("Bloqué au début des pompes classiques → retour aux pompes sur les genoux", r.type === "descente" && r.etat.niveau === 1);

    // 18. Rythme doux : 2 réussites avant de monter
    r = appliquerResultat(pompes, { niveau: 0, objectif: 6, echecs: 0, reussites: 0 }, [6, 6, 6], { reussitesPourMonter: 2 });
    verifier("Débutant : 1re réussite, l'objectif ne bouge pas encore", r.type === "valide" && r.etat.objectif === 6 && r.etat.reussites === 1);
    r = appliquerResultat(pompes, r.etat, [6, 6, 6], { reussitesPourMonter: 2 });
    verifier("Débutant : 2e réussite, l'objectif monte", r.type === "progres" && r.etat.objectif === 7);

    // 19. Les niveaux impossibles sont sautés (pas de barre → pas d'abdos suspendus)
    const abdos = famille("abdos");
    const sansBarre = profilDe({});
    r = appliquerResultat(abdos, { niveau: 2, objectif: 15, echecs: 0 }, [15, 15, 15], { permis: permisPour(abdos, sansBarre) });
    verifier("Sans barre : pas de passage aux relevés suspendus", r.type === "max" && r.etat.niveau === 2);

    // 20. Programme sans barre : pas de tractions, mais du dos sans barre
    let prog = genererProgramme(profilDe({}));
    let ids = famillesDuProgramme(prog);
    verifier("Sans barre : pas de tractions, dos sans barre à la place", ids.indexOf("tractions") < 0 && ids.indexOf("tirage") >= 0);
    prog = genererProgramme(profilDe({ materiel: ["barre"] }));
    verifier("Avec barre : tractions au programme", famillesDuProgramme(prog).indexOf("tractions") >= 0);

    // 21. Genoux sensibles : fessiers à la place des jambes
    ids = famillesDuProgramme(genererProgramme(profilDe({ limitations: ["genoux"] })));
    verifier("Genoux sensibles : pas de jambes, fessiers à la place", ids.indexOf("jambes") < 0 && ids.indexOf("fessiers") >= 0);

    // 22. Douleurs : aucun exercice déconseillé dans le programme
    let interdit = [];
    ["poignets", "genoux", "dos", "epaules"].forEach(function (l) {
      ["muscle", "perte", "force", "forme"].forEach(function (o) {
        const pr = profilDe({ objectif: o, niveau: "confirme", materiel: ["barre", "paralleles", "elastique"], limitations: [l], duree: 60 });
        const progression = preparerProgression({}, pr);
        Object.keys(progression).forEach(function (id) {
          const niv = famille(id).niveaux[progression[id].niveau];
          if (niv.eviter && niv.eviter.indexOf(l) >= 0) interdit.push(l + "/" + o + " : " + niv.nom);
        });
      });
    });
    verifier("Aucun exercice déconseillé pour la douleur signalée" + (interdit.length ? " — " + interdit.join(", ") : ""), interdit.length === 0);

    // 23. Durée → nombre d'exercices
    verifier("15 min = 3 exercices × 2 séries", genererProgramme(profilDe({ duree: 15 })).seances[0].length === 3 && genererProgramme(profilDe({ duree: 15 })).seances[0][0].series === 2);
    verifier("45 min = 5 exercices", genererProgramme(profilDe({ duree: 45 })).seances[0].length === 5);
    verifier("Perte de poids : du cardio au programme", famillesDuProgramme(genererProgramme(profilDe({ objectif: "perte" }))).indexOf("cardio") >= 0);

    // 24. Niveau de départ selon le niveau ressenti
    verifier("Jamais fait de sport : on commence aux pompes inclinées", niveauDepart(pompes, profilDe({ niveau: "jamais" })) === 0);
    verifier("Confirmé sans parallèles : dips sur chaise (pas aux barres)", niveauDepart(famille("dips"), profilDe({ niveau: "confirme" })) === 1);

    // 25. Test de niveau
    const nt = niveauxDepuisTest({ pompes: 12, tractions: 0, gainage: 45, abdos: 10 }, profilDe({ niveau: "debutant", materiel: ["barre"] }));
    verifier("Test : 12 pompes → pompes classiques, objectif 7", nt.pompes.niveau === 2 && nt.pompes.objectif === 7);
    verifier("Test : 0 traction → tractions australiennes", nt.tractions.niveau === 1);
    verifier("Test : planche 45 s → planche, objectif 25 s", nt.gainage.niveau === 0 && nt.gainage.objectif === 25);
    verifier("Test : 0 pompe → pompes inclinées", niveauxDepuisTest({ pompes: 0 }, profilDe({})).pompes.niveau === 0);

    // 26. Semaine légère toutes les 5 semaines
    const dl = { profil: profilDe({}), debutProgramme: new Date(2026, 0, 5).toISOString() };
    verifier("Semaine 1 : normale", !estSemaineLegere(dl, new Date(2026, 0, 6)));
    verifier("Semaine 5 : légère", estSemaineLegere(dl, new Date(2026, 1, 3)));
    verifier("Programme d'origine : jamais de semaine légère", !estSemaineLegere({ profil: profilClassique(3), debutProgramme: dl.debutProgramme }, new Date(2026, 1, 3)));

    // 27. Migration des anciennes données (version 1)
    const v1 = { version: 1, configure: true, poidsObjectif: 70, seancesParSemaine: 4,
      progression: { tractions: { niveau: 3, objectif: 7, echecs: 1 }, pompes: { niveau: 2, objectif: 9, echecs: 0 }, abdos: { niveau: 1, objectif: 10, echecs: 0 }, gainage: { niveau: 0, objectif: 30, echecs: 0 } },
      seances: [{ date: "2026-09-01T08:00:00Z", exercices: [] }], poids: [{ date: "2026-09-01T08:00:00Z", kg: 61 }], enCours: null };
    const m = migrerDonnees(JSON.parse(JSON.stringify(v1)));
    verifier("Migration : version 2, historique et pesées gardés", m.version === 2 && m.seances.length === 1 && m.poids.length === 1);
    verifier("Migration : niveaux gardés", m.progression.tractions.niveau === 3 && m.progression.tractions.objectif === 7 && m.progression.tractions.echecs === 1);
    verifier("Migration : poids visé et séances/semaine dans le profil", m.profil.poidsVise === 70 && m.profil.seancesParSemaine === 4 && !("poidsObjectif" in m));
    verifier("Migration : programme d'origine gardé + questionnaire proposé", m.profil.classique && m.proposerQuestionnaire);
    const progClassique = genererProgramme(m.profil);
    verifier("Programme d'origine : les 4 mêmes exercices, 3 séries", progClassique.seances.length === 1 &&
      progClassique.seances[0].map(function (e) { return e.famille; }).join() === "tractions,pompes,abdos,gainage" &&
      progClassique.seances[0].every(function (e) { return e.series === 3; }));
    verifier("Migration : une donnée déjà à jour ne change pas", JSON.stringify(migrerDonnees(JSON.parse(JSON.stringify(m)))) === JSON.stringify(m));
    verifier("Nouvel utilisateur : aucune donnée personnelle par défaut", donneesParDefaut().profil === null && donneesParDefaut().poids.length === 0 && !("poidsObjectif" in donneesParDefaut()));

    // 28. Échauffement adapté
    const ech = echauffementPour(profilDe({ limitations: ["genoux"] }));
    verifier("Échauffement sans barre ni sauts", ech.every(function (e) { return e.anim !== "tractions-0" && e.anim !== "echauffement-jumping"; }));

    // 29. Tendance pour perdre du poids
    tp = tendancePoids([{ date: jour(0), kg: 80 }, { date: jour(7), kg: 79.5 }, { date: jour(14), kg: 79 }], 75);
    verifier("Perte : −0,5 kg/semaine = bon rythme", tp.type === "bon" && tp.sens === -1);
    tp = tendancePoids([{ date: jour(0), kg: 80 }, { date: jour(14), kg: 81 }], 75);
    verifier("Perte : le poids remonte", tp.type === "inverse");
    tp = tendancePoids([{ date: jour(0), kg: 70 }, { date: jour(14), kg: 70.1 }], null);
    verifier("Sans poids visé : stable", tp.type === "stable");

    // 16. Simulation : si tout est réussi, combien de semaines par niveau ?
    let simu = "";
    FAMILLES.forEach(function (f) {
      let etat = etatInitial(f, 0), nb = 0, lignes = [];
      let debutNiveau = 0;
      while (nb < 1000) {
        const avant = etat.niveau;
        etat = appliquerResultat(f, etat, [999, 999, 999]).etat;
        nb++;
        if (etat.niveau !== avant) {
          lignes.push(f.niveaux[avant].nom + " : " + (nb - debutNiveau) + " séances (~" + ((nb - debutNiveau) / 3).toFixed(1) + " sem.)");
          debutNiveau = nb;
        }
        if (etat.niveau === f.niveaux.length - 1 && etat.objectif === f.niveaux[etat.niveau].max) break;
      }
      simu += f.nom + "\n  " + lignes.join("\n  ") + "\n";
    });
    const pre = document.createElement("pre");
    pre.textContent = "Simulation « tout réussi » (rythme maximum théorique, à 3 séances/semaine) :\n" + simu;
    document.body.appendChild(pre);

    const bilan = document.createElement("h2");
    bilan.className = rates ? "ko" : "ok";
    bilan.textContent = reussis + " tests réussis, " + rates + " ratés";
    document.body.insertBefore(bilan, document.getElementById("resultats"));
  </script>
</body>
</html>
