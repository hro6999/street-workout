<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests de la progression</title>
  <style>
    body { background: #0f1115; color: #f1f3f6; font-family: system-ui, sans-serif; padding: 16px; font-size: 15px; }
    .ok { color: #34c759; } .ko { color: #ff5a4f; font-weight: bold; }
    pre { white-space: pre-wrap; color: #9aa3b2; }
  </style>
</head>
<body>
  <h1>Tests de la progression</h1>
  <div id="resultats"></div>

  <script src="exercices.js"></script>
  <script src="animations.js"></script>
  <script src="progression.js"></script>
  <script>
    // Petit outil de test : affiche ✅ ou ❌ pour chaque vérification
    let reussis = 0, rates = 0;
    function verifier(nom, condition) {
      const p = document.createElement("div");
      p.className = condition ? "ok" : "ko";
      p.textContent = (condition ? "✅ " : "❌ ") + nom;
      document.getElementById("resultats").appendChild(p);
      condition ? reussis++ : rates++;
    }

    const pompes = FAMILLES.find(f => f.id === "pompes");
    const gainage = FAMILLES.find(f => f.id === "gainage");
    const tractions = FAMILLES.find(f => f.id === "tractions");

    // 1. Séance réussie → +1 répétition
    let r = appliquerResultat(pompes, { niveau: 0, objectif: 6, echecs: 0 }, [6, 6, 7]);
    verifier("Réussite : 3×6 → 3×7", r.type === "progres" && r.etat.objectif === 7);

    // 2. Une série ratée → l'objectif ne bouge pas
    r = appliquerResultat(pompes, { niveau: 0, objectif: 8, echecs: 0 }, [8, 8, 6]);
    verifier("Échec : l'objectif reste à 8", r.type === "stagne" && r.etat.objectif === 8 && r.etat.echecs === 1);

    // 3. Séries pas toutes cochées → échec
    r = appliquerResultat(pompes, { niveau: 0, objectif: 8, echecs: 0 }, [10, 10]);
    verifier("2 séries sur 3 seulement = échec", r.type === "stagne");

    // 4. 3 échecs de suite → l'objectif baisse d'un cran
    r = appliquerResultat(pompes, { niveau: 0, objectif: 10, echecs: 2 }, [5, 5, 5]);
    verifier("3e échec : objectif 10 → 9, compteur remis à 0", r.type === "baisse" && r.etat.objectif === 9 && r.etat.echecs === 0);

    // 5. Ne descend jamais sous le début du niveau
    r = appliquerResultat(pompes, { niveau: 0, objectif: 6, echecs: 2 }, [2, 2, 2]);
    verifier("La baisse ne passe pas sous le début du niveau (6)", r.etat.objectif === 6);

    // 6. Une réussite remet le compteur d'échecs à 0
    r = appliquerResultat(pompes, { niveau: 0, objectif: 8, echecs: 2 }, [8, 8, 8]);
    verifier("Réussite après 2 échecs : compteur à 0", r.etat.echecs === 0 && r.etat.objectif === 9);

    // 7. Objectif max réussi → niveau suivant
    r = appliquerResultat(pompes, { niveau: 0, objectif: 15, echecs: 0 }, [15, 15, 15]);
    verifier("3×15 réussi → niveau 2 (pompes genoux, 3×6)", r.type === "niveau" && r.etat.niveau === 1 && r.etat.objectif === 6);

    // 8. Ne dépasse pas le max
    r = appliquerResultat(gainage, { niveau: 0, objectif: 58, echecs: 0 }, [60, 60, 60]);
    verifier("Gainage : 58 s +5 plafonné à 60 s", r.etat.objectif === 60);

    // 9. Dernier niveau maîtrisé → on reste
    const dernier = tractions.niveaux.length - 1;
    r = appliquerResultat(tractions, { niveau: dernier, objectif: 10, echecs: 0 }, [10, 10, 10]);
    verifier("Dernier niveau maîtrisé : on reste au dernier niveau", r.type === "max" && r.etat.niveau === dernier);

    // 10. Compteur de la semaine (lundi → dimanche)
    const mercredi = new Date(2026, 10, 25, 8, 0);   // mercredi 25 nov. 2026
    const seances = [
      { date: new Date(2026, 10, 22, 8, 0).toISOString() },  // dimanche d'avant
      { date: new Date(2026, 10, 23, 7, 0).toISOString() },  // lundi
      { date: new Date(2026, 10, 25, 7, 0).toISOString() },  // mercredi
    ];
    verifier("Compteur semaine : 2 séances depuis lundi", seancesCetteSemaine(seances, mercredi) === 2);

    // 11. Chaque niveau a son animation et ses conseils
    let manque = [];
    FAMILLES.forEach(function (f) {
      f.niveaux.forEach(function (n, i) {
        if (!ANIM.existe(f.id + "-" + i)) manque.push("animation " + f.id + "-" + i);
        if (!n.points || n.points.length < 2) manque.push("points " + n.nom);
        if (!n.erreurs || n.erreurs.length < 1) manque.push("erreurs " + n.nom);
      });
    });
    ECHAUFFEMENT.forEach(function (e) { if (!ANIM.existe(e.anim)) manque.push("échauffement " + e.anim); });
    verifier("Animations et conseils présents partout" + (manque.length ? " — manque : " + manque.join(", ") : ""), manque.length === 0);

    // 12. Les dessins ne contiennent pas de valeurs cassées (NaN)
    const casses = ANIM.cles().filter(function (c) {
      for (let t = 0; t < ANIM.duree(c); t += 150) if (ANIM.instant(c, t).indexOf("NaN") >= 0) return true;
      return false;
    });
    verifier("Aucune animation cassée" + (casses.length ? " : " + casses.join(", ") : ""), casses.length === 0);

    // 13. Échauffement d'environ 5 minutes
    const totalEchauffement = ECHAUFFEMENT.reduce(function (t, e) { return t + e.duree; }, 0);
    verifier("Échauffement entre 4 et 6 minutes (" + totalEchauffement + " s)", totalEchauffement >= 240 && totalEchauffement <= 360);

    // 14. Records
    const histo = [
      { exercices: [{ famille: "pompes", niveau: 2, faites: [8, 10, 9] }] },
      { exercices: [{ famille: "pompes", niveau: 2, faites: [11, 9, 9] }, { famille: "pompes", niveau: 3, faites: [] }] },
    ];
    verifier("Record pompes niveau 3 : 11", meilleureSerie(histo, "pompes", 2) === 11);
    verifier("Pas de record à un niveau jamais fait", meilleureSerie(histo, "pompes", 4) === null);
    verifier("Plus haut niveau avec des séries faites : 2 (pas 3, vide)", niveauMaxAtteint(histo, "pompes") === 2);

    // 15. Tendance du poids
    const jour = function (n) { return new Date(2026, 10, 1 + n, 8).toISOString(); };
    let tp = tendancePoids([{ date: jour(0), kg: 60 }], 70, new Date(2026, 10, 2));
    verifier("1 seule pesée : on attend", tp.type === "attente");
    tp = tendancePoids([{ date: jour(0), kg: 60 }, { date: jour(7), kg: 60.3 }, { date: jour(14), kg: 60.7 }], 70);
    verifier("+0,35 kg/semaine : bon rythme (" + tp.parSemaine + ")", tp.type === "bon" && Math.abs(tp.parSemaine - 0.35) < 0.05);
    tp = tendancePoids([{ date: jour(0), kg: 61 }, { date: jour(7), kg: 61 }, { date: jour(14), kg: 61.1 }], 70);
    verifier("Poids qui ne bouge pas : stagne", tp.type === "stagne");
    tp = tendancePoids([{ date: jour(0), kg: 60 }, { date: jour(14), kg: 62 }], 70);
    verifier("+1 kg/semaine : trop rapide", tp.type === "rapide");
    tp = tendancePoids([{ date: jour(0), kg: 62 }, { date: jour(14), kg: 61.5 }], 70);
    verifier("Poids qui baisse : baisse", tp.type === "baisse");
    tp = tendancePoids([{ date: jour(0), kg: 69.5 }, { date: jour(14), kg: 70.1 }], 70);
    verifier("Objectif dépassé : atteint", tp.type === "atteint");

    // 16. Simulation : si tout est réussi, combien de semaines par niveau ?
    let simu = "";
    FAMILLES.forEach(function (f) {
      let etat = etatInitial(f, 0), nb = 0, lignes = [];
      let debutNiveau = 0;
      while (nb < 1000) {
        const avant = etat.niveau;
        etat = appliquerResultat(f, etat, [999, 999, 999]).etat;
        nb++;
        if (etat.niveau !== avant) {
          lignes.push(f.niveaux[avant].nom + " : " + (nb - debutNiveau) + " séances (~" + ((nb - debutNiveau) / 3).toFixed(1) + " sem.)");
          debutNiveau = nb;
        }
        if (etat.niveau === f.niveaux.length - 1 && etat.objectif === f.niveaux[etat.niveau].max) break;
      }
      simu += f.nom + "\n  " + lignes.join("\n  ") + "\n";
    });
    const pre = document.createElement("pre");
    pre.textContent = "Simulation « tout réussi » (rythme maximum théorique, à 3 séances/semaine) :\n" + simu;
    document.body.appendChild(pre);

    const bilan = document.createElement("h2");
    bilan.className = rates ? "ko" : "ok";
    bilan.textContent = reussis + " tests réussis, " + rates + " ratés";
    document.body.insertBefore(bilan, document.getElementById("resultats"));
  </script>
</body>
</html>
